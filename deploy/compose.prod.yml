services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Sized for a small shared host; raise the buffer pool if the database outgrows it.
    command: ['--performance-schema=OFF', '--innodb-buffer-pool-size=64M']
    environment:
      MYSQL_DATABASE: chronicle
      MYSQL_USER: chronicle
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/chronicle.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/chronicle.env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: ghcr.io/nvanderploeg/chronicle:${CHRONICLE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://chronicle:${MYSQL_PASSWORD}@db:3306/chronicle
      ORIGIN: ${ORIGIN:?set ORIGIN in deploy/chronicle.env}
      CHRONICLE_IDLE_MS: ${CHRONICLE_IDLE_MS:-}
      CHRONICLE_HEARTBEAT_MS: ${CHRONICLE_HEARTBEAT_MS:-}
      CHRONICLE_WRITES_PER_WINDOW: ${CHRONICLE_WRITES_PER_WINDOW:-}
      CHRONICLE_WRITE_WINDOW_MS: ${CHRONICLE_WRITE_WINDOW_MS:-}
      # Set by deploy/nginx; without it every client shares the proxy's write limit.
      ADDRESS_HEADER: x-real-ip
    ports:
      - '127.0.0.1:3280:3000'

volumes:
  mysqldata:
