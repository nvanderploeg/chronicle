services:
  db:
    image: postgres:17
    restart: unless-stopped
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=50']
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/chronicle.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chronicle -d chronicle']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: ghcr.io/nvanderploeg/chronicle:${CHRONICLE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chronicle:${POSTGRES_PASSWORD}@db:5432/chronicle
      ORIGIN: ${ORIGIN:?set ORIGIN in deploy/chronicle.env}
      CHRONICLE_IDLE_MS: ${CHRONICLE_IDLE_MS:-}
      CHRONICLE_HEARTBEAT_MS: ${CHRONICLE_HEARTBEAT_MS:-}
      CHRONICLE_WRITES_PER_WINDOW: ${CHRONICLE_WRITES_PER_WINDOW:-}
      CHRONICLE_WRITE_WINDOW_MS: ${CHRONICLE_WRITE_WINDOW_MS:-}
      # Set by deploy/nginx; without it every client shares the proxy's write limit.
      ADDRESS_HEADER: x-real-ip
      # Unset: /admin and its endpoints answer 404.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # One setting sizes the import limit and the node adapter's body limit; keep nginx in step.
      ADMIN_MAX_BUNDLE_MB: ${ADMIN_MAX_BUNDLE_MB:-256}
      BODY_SIZE_LIMIT: ${ADMIN_MAX_BUNDLE_MB:-256}M
    volumes:
      - backups:/backups
    ports:
      - '127.0.0.1:3280:3000'

volumes:
  pgdata:
  backups:
