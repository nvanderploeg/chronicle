services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3316}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: chronicle
      MYSQL_USER: chronicle
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chronicle}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-rootpassword}'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ghcr.io/nvanderploeg/chronicle:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${CHRONICLE_PORT:-3280}:3000'
    environment:
      DATABASE_URL: mysql://chronicle:${MYSQL_PASSWORD:-chronicle}@db:3306/chronicle
      ORIGIN: ${CHRONICLE_ORIGIN:-http://localhost:3280}
volumes:
  mysqldata:
