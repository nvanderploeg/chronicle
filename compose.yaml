services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5436}:5432'
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronicle}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chronicle -d chronicle']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ghcr.io/nvanderploeg/chronicle:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${CHRONICLE_PORT:-3280}:3000'
    environment:
      DATABASE_URL: postgres://chronicle:${POSTGRES_PASSWORD:-chronicle}@db:5432/chronicle
      ORIGIN: ${CHRONICLE_ORIGIN:-http://localhost:3280}
      # Unset: /admin and its endpoints answer 404.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_MAX_BUNDLE_MB: ${ADMIN_MAX_BUNDLE_MB:-256}
      BODY_SIZE_LIMIT: ${ADMIN_MAX_BUNDLE_MB:-256}M
    volumes:
      - backups:/backups
volumes:
  pgdata:
  backups:
